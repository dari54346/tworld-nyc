.err { font-size: 15px; font-weight: 600; color: #8A1C1C; background: #FFFFFF; border-radius: 8px; padding: 10px 12px; }
.tick { display: flex; gap: 12px; align-items: center; font-size: 16px; }
.card { background: var(--light); color: var(--green); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.outline { border: 1.5px solid var(--light); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.score { display: flex; align-items: baseline; gap: 8px; }

    h = topBar() + '<div class="bar"><div style="width:' + Math.round((i + 1) / (list.length + 1) * 100) + '%"></div></div>' +
      '<div class="stack" style="gap:6px"><div class="label" style="letter-spacing:1px">QUESTION ' + (i + 1) + ' OF ' + list.length + '</div>' +
      '<h2 class="serif">' + q.title + '</h2><p class="sub">' + q.hint + '</p></div>';
    if (q.text) {
      h += '<form class="stack" style="gap:12px" data-form="text"><label class="field">' + q.label +
        '<input type="text" id="txt" autocomplete="off" placeholder="' + esc(q.ph) + '" value="' + esc(S.t[q.id] || '') + '"></label>' +
        (S.err ? '<div class="err" role="alert">' + S.err + '</div>' : '') +
        '<button class="btn" type="submit">Continue</button></form>';
    } else {
      h += '<div class="stack" style="gap:9px">' + q.opts.map(function (o, n) { return '<button class="opt" data-opt="' + n + '">' + o + '</button>'; }).join('') + '</div>';
    }
  } else if (S.screen === 'contact') {
    var cur = S.a.intent === 2;
    h = topBar() + '<div class="stack" style="gap:6px"><div class="label" style="letter-spacing:1px">YOUR SCORE IS READY</div>' +
      '<h2 class="serif">' + (cur ? 'Where should we send your results?' : 'Where should your broker reach you?') + '</h2>' +
      '<p class="sub">' + (cur ? 'Please double-check your details so your results reach you.' : 'Your broker calls with your price range, so please double-check your phone number.') + '</p></div>' +
      '<form class="stack" style="gap:12px" data-form="contact" novalidate>' +
      '<label class="field">Name<input type="text" id="c_name" autocomplete="name" value="' + esc(S.c.name) + '"></label>' +
      '<label class="field">Mobile number<input type="tel" id="c_phone" autocomplete="tel" placeholder="(212) 555-0100" value="' + esc(S.c.phone) + '"></label>' +
      '<label class="field">Email<input type="email" id="c_email" autocomplete="email" value="' + esc(S.c.email) + '"></label>' +
      '<input type="text" id="c_hp" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">' +
      (S.err ? '<div class="err" role="alert">' + S.err + '</div>' : '') +
      '<button class="btn" type="submit">Show my score</button></form>' +
      '<p class="small">We only use your details to reach you about your results. 100% confidential.</p>';
  } else if (S.screen === 'result') {
    dark = true;
    var n = score(), curious = S.a.intent === 2, out = S.a.location === 2, profit = (S.a.takehome || 0) > 0;
    var title = curious ? 'Next: your free valuation range' : 'Next: your price range';
    var body = curious ? 'We can email you a free valuation range for your business.'
      : out ? 'We will connect you with the Transworld office that covers your area, and a local broker will call you. The call is free and confidential.'
      : 'A Transworld broker will call you within 1 business day. The call is free and confidential.';
    h = '<img class="logo" style="align-self:flex-start;height:36px" src="assets/logo-white.png" alt="Transworld Business Advisors">' +
      '<div class="stack" style="gap:4px;margin-top:6px"><div class="label soft">YOUR PRELIMINARY SELLABILITY SCORE</div>' +
      '<div class="score"><span class="serif">' + n + '</span><span class="soft" style="font-size:22px">out of 100</span></div>' +
      '<div style="font-size:20px;font-weight:700">' + scoreLabel(n) + '</div></div>' +
      '<div class="card"><div class="serif" style="font-size:22px;line-height:1.15">' + title + '</div><p class="sub">' + body + '</p></div>';
    if (curious) {
      if (S.rangeStep === 'ask') {
        h += '<form class="stack" style="gap:12px" data-form="range"><label class="field" style="font-size:15px">Your take-home last year, as one number' +
          '<input type="text" id="exact" inputmode="numeric" placeholder="e.g. $180,000" value="' + esc(S.exact) + '"></label>' +
          (S.err ? '<div class="err" role="alert">' + S.err + '</div>' : '') +
          '<button class="btn" type="submit">Send my valuation range</button></form>';
      } else {
        h += '<button class="btn" data-act="range"' + (S.rangeStep === 'sent' ? ' disabled' : '') + '>' + (S.rangeStep === 'sent' ? 'Sent. Check your inbox' : 'Email me my valuation range') + '</button>';
        if (profit) {
          h += '<div class="outline"><div class="label soft" style="letter-spacing:1px">WANT THE FULL PICTURE?</div>' +
            '<div class="serif" style="font-size:22px;line-height:1.15">Broker Opinion of Value, $3,750</div>' +
            '<p class="sub soft">A full deep dive into your business, priced using Transworld\'s own sold-business data that no public source has.</p>' +
            '<button class="ghost" style="margin-top:4px" data-act="bov"' + (S.bov ? ' disabled' : '') + '>' + (S.bov ? 'Thanks. A broker will contact you' : 'Ask about a BOV') + '</button></div>';
        }
      }
    } else {
      h += '<button class="btn" data-act="ws"' + (S.ws ? ' disabled' : '') + '>' + (S.ws ? 'Sent. Check your inbox' : 'Email me the free SDE worksheet') + '</button>';
    }
    h += '<div class="grow"></div><p class="small soft">This score is a starting point based on your answers, not a formal valuation.</p>' + testNote();
  } else if (S.screen === 'exit') {
    h = topBar() + '<div class="stack" style="margin-top:32px"><h2 class="serif" style="font-size:32px">Looking to buy? You are in the right place.</h2>' +
      '<p class="lead">This check is for owners. Browse every business we have for sale, with prices and cash flow, on tworld.com.</p></div>' +
      '<a class="btn green" href="' + esc(CONFIG.buyerUrl) + '">Browse businesses for sale</a>';
  }
  document.body.className = dark ? 'dark' : '';
  app.innerHTML = h;
  var f = document.getElementById('txt') || (S.rangeStep === 'ask' ? document.getElementById('exact') : null);
  if (f) f.focus();
}

function next() {
  var list = active(), i = list.map(function (q) { return q.id; }).indexOf(S.qid);
  if (i >= list.length - 1) go({ screen: 'contact' }); else go({ qid: list[i + 1].id });
}
function back() {
  if (S.screen === 'exit' || S.screen === 'contact') return go({ screen: 'q' });
  var list = active(), i = list.map(function (q) { return q.id; }).indexOf(S.qid);
  if (i <= 0) go({ screen: 'hero' }); else go({ qid: list[i - 1].id });
}

app.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var act = b.getAttribute('data-act'), opt = b.getAttribute('data-opt');
  if (opt !== null) {
    var q = Q.filter(function (x) { return x.id === S.qid; })[0], n = Number(opt);
    if (q.exit === n) return go({ screen: 'exit' });
    S.a[q.id] = n; return next();
  }
  if (act === 'start') return go({ screen: 'q', qid: 'role' });
  if (act === 'back') return back();
  if (act === 'range') {
    if ((S.a.takehome || 0) > 0) return go({ rangeStep: 'ask' });
    send('range_request'); return go({ rangeStep: 'sent' });
  }
  if (act === 'bov') { send('bov_request'); return go({ bov: true }); }
  if (act === 'ws') { send('worksheet_request'); return go({ ws: true }); }
});

app.addEventListener('submit', function (e) {
  e.preventDefault();
  var kind = e.target.getAttribute('data-form');
  if (kind === 'text') {
    var v = document.getElementById('txt').value.trim();
    if (!v) return go({ err: 'Please type an answer to continue.' });
    S.t[S.qid] = v; return next();
  }
  if (kind === 'contact') {
    var name = document.getElementById('c_name').value.trim(), phone = document.getElementById('c_phone').value.trim(),
        email = document.getElementById('c_email').value.trim();
    S.c = { name: name, phone: phone, email: email };
    if (document.getElementById('c_hp').value) S.bot = true;
    var d = phone.replace(/\D/g, ''); if (d.length === 11 && d[0] === '1') d = d.slice(1);
    if (!name) return go({ err: 'Please enter your name.' });
    if (!(d.length === 10 && /[2-9]/.test(d[0]) && /[2-9]/.test(d[3]))) return go({ err: 'Please enter a 10-digit US phone number, area code first.' });
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return go({ err: 'Please check your email address.' });
    S.c.phone = '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
    var isLead = S.a.location !== 2 && S.a.intent !== 2;
    send('lead', { meta_lead: isLead ? 'yes' : 'no' });
    if (isLead && window.fbq) fbq('track', 'Lead');
    return go({ screen: 'result' });
  }
  if (kind === 'range') {
    var x = parseMoney(document.getElementById('exact').value);
    if (!x) return go({ err: 'Please enter your take-home as a number, for example 180000.' });
    S.exact = String(x);
    send('range_request'); return go({ rangeStep: 'sent' });
  }
});

app.addEventListener('input', function (e) {
  if (e.target.id !== 'c_phone') return;
  var d = e.target.value.replace(/\D/g, '');
  if (d[0] === '1') d = d.slice(1);
  d = d.slice(0, 10);
  var o = d;
  if (d.length > 6) o = '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  else if (d.length > 3) o = '(' + d.slice(0, 3) + ') ' + d.slice(3);
  else if (d.length > 0) o = '(' + d;
  e.target.value = o;
});

if (CONFIG.pixelId) {
  !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
    if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
    s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.pixelId); fbq('track', 'PageView');
}
render();
</script>
</body>
</html>
